name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:exports
      # The release publishes with npm 11, which silently drops package.json fields it finds
      # invalid (a "./" bin path, for one). Fail here instead.
      - name: Check npm 11 publishes package.json unchanged
        run: |
          npx -y npm@11 publish --dry-run 2>&1 | tee publish.log
          if grep -q 'auto-corrected' publish.log; then exit 1; fi
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: tdx-taiwan-mcp-*.tgz

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  runtime:
    name: Packed package on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: package
      # Install the tarball into an empty project, then list the tools over stdio.
      - name: Smoke test
        run: |
          mkdir smoke && cd smoke
          npm init -y > /dev/null
          npm install ../tdx-taiwan-mcp-*.tgz
          npx tdx-taiwan-mcp --version
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | TDX_CLIENT_ID=id TDX_CLIENT_SECRET=secret npx tdx-taiwan-mcp > out.jsonl
          for tool in youbike_nearby bus_eta bus_stops_nearby bus_stop_arrivals thsr_timetable \
            rail_station_departures rail_station_info metro_travel_time \
            flight_status ferry_timetable traffic_live traffic_travel_time parking_nearby \
            ev_charger_nearby tdx_get; do
            grep -q "\"name\":\"$tool\"" out.jsonl || { echo "::error::$tool missing"; exit 1; }
          done
          echo "tools/list ok"
