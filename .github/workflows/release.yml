# Publishes to npm with provenance when a version tag is pushed:
#
#   npm version patch|minor|major   # bumps package.json, commits and tags vX.Y.Z
#   git push --follow-tags
#
# Uses npm trusted publishing (OIDC), so no npm token is stored in the repository. The trusted
# publisher is configured on npmjs.com (package settings) for this repository and this file.
# Then lists the version in the MCP registry (registry.modelcontextprotocol.io) from server.json,
# signing in with the same GitHub OIDC token; `npm version` keeps server.json in step.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Pinned on purpose; upgrade deliberately. The binary is verified with cosign below.
  MCP_PUBLISHER_VERSION: v1.8.1

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:exports
      # Re-running a release (or a version first published by hand) only creates the GitHub
      # release.
      - name: Check whether this version is already on npm
        id: npm
        run: |
          spec="$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "::notice::$spec is already on npm; skipping the publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check npm publishes package.json unchanged
        if: steps.npm.outputs.published != 'true'
        run: |
          npm publish --dry-run 2>&1 | tee publish.log
          if grep -q 'auto-corrected' publish.log; then exit 1; fi
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as is."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
      - run: npm run build:mcpb
      - name: Attach the Claude Desktop extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/*.mcpb --clobber
      - name: Check whether this version is already in the MCP registry
        id: registry
        run: |
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          if curl --fail --silent --show-error \
            "https://registry.modelcontextprotocol.io/v0.1/servers?search=$name" |
            jq -e --arg n "$name" --arg v "$version" \
              '.servers[].server | select(.name == $n and .version == $v)' > /dev/null; then
            echo "::notice::$name $version is already in the MCP registry; skipping."
            echo "listed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.listed != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        if: steps.registry.outputs.listed != 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" \
            "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish to the MCP registry
        if: steps.registry.outputs.listed != 'true'
        run: |
          # The registry checks the npm version, which can take a minute to appear after a
          # publish.
          spec="$(jq -r '.packages[0].identifier + "@" + .packages[0].version' server.json)"
          for attempt in $(seq 1 30); do
            if npm view "$spec" version > /dev/null 2>&1; then break; fi
            echo "Waiting for $spec on npm ($attempt/30)"
            sleep 10
          done
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
