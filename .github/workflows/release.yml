# Publishes to npm with provenance when a version tag is pushed:
#
#   npm version patch|minor|major   # bumps package.json, commits and tags vX.Y.Z
#   git push --follow-tags
#
# Uses npm trusted publishing (OIDC), so no npm token is stored in the repository. The trusted
# publisher is configured on npmjs.com (package settings) for this repository and this file.
# npm only offers that setting once the package exists, so the first version goes out with an
# `NPM_TOKEN` repository secret (a granular token allowed to publish); delete the secret once
# trusted publishing is set up.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:exports
      - name: Check npm publishes package.json unchanged
        run: |
          npm publish --dry-run 2>&1 | tee publish.log
          if grep -q 'auto-corrected' publish.log; then exit 1; fi
      - run: npm publish --provenance --access public
        env:
          # Only used when trusted publishing is not set up yet (first release).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as is."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
